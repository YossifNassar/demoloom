<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Board</title>
<style>
  :root {
    --bg: #F6F7FB; --panel: #FFFFFF; --line: #E4E7EF; --ink: #161A26; --muted: #6B7287;
    --brand: #4F46E5; --brand-soft: #EEF0FF; --ok: #16A34A; --ok-soft: #E8F7EE; --warn: #D97706; --warn-soft: #FEF3E2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 32px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 800; }
  header h1 { font-size: 18px; margin: 0; }
  header .sp { flex: 1; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--bg); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .status.busy .dot { background: var(--warn); animation: pulse 0.8s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #A5B4FC, #6366F1); }
  main { padding: 28px 32px; }
  .add { display: flex; gap: 10px; margin-bottom: 26px; max-width: 640px; }
  .add input { flex: 1; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); outline: none; }
  .add input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .add button { background: var(--brand); color: #fff; font-weight: 650; padding: 0 20px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .col { background: #EEF0F6; border-radius: 14px; padding: 14px; min-height: 520px; }
  .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 6px 12px; display: flex; justify-content: space-between; }
  .col h2 span { background: var(--panel); border-radius: 999px; padding: 0 9px; color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(22,26,38,0.04); }
  .card.new { animation: drop 0.35s ease-out; }
  @keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card .t { font-weight: 600; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .card button { background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 600; padding: 6px 12px; border: 1px solid var(--line); }
  .card.done .t { color: var(--muted); text-decoration: line-through; }
</style>
</head>
<body>
<header>
  <div class="logo">T</div>
  <h1>Tiny Board</h1>
  <div class="sp"></div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">All synced</span></div>
  <div class="avatar"></div>
</header>
<main>
  <form class="add" id="add">
    <input id="new" placeholder="Add a task..." autocomplete="off">
    <button type="submit">Add task</button>
  </form>
  <div class="cols">
    <section class="col" data-col="todo"><h2>To do <span>0</span></h2><div class="list"></div></section>
    <section class="col" data-col="doing"><h2>Doing <span>0</span></h2><div class="list"></div></section>
    <section class="col" data-col="done"><h2>Done <span>0</span></h2><div class="list"></div></section>
  </div>
</main>
<script>
  // a tiny in-memory board: no network, no storage
  const tasks = [
    { id: 1, title: 'Draft release notes', tag: 'Docs', col: 'todo' },
    { id: 2, title: 'Review onboarding copy', tag: 'Design', col: 'todo' },
    { id: 3, title: 'Fix the flaky upload test', tag: 'Eng', col: 'doing' },
    { id: 4, title: 'Book the team retro', tag: 'Ops', col: 'done' },
  ];
  let fresh = null, nextId = 5;
  const NEXT = { todo: ['Start', 'doing'], doing: ['Done', 'done'] };
  function draw() {
    for (const sec of document.querySelectorAll('.col')) {
      const col = sec.dataset.col, list = sec.querySelector('.list'), mine = tasks.filter((t) => t.col === col);
      sec.querySelector('h2 span').textContent = mine.length;
      list.innerHTML = '';
      for (const t of mine) {
        const el = document.createElement('div');
        el.className = 'card' + (t.col === 'done' ? ' done' : '') + (t.id === fresh ? ' new' : '');
        el.dataset.id = t.id;
        el.innerHTML = `<div class="t"></div><div class="meta"><span class="tag${t.col === 'done' ? ' ok' : ''}"></span></div>`;
        el.querySelector('.t').textContent = t.title;
        el.querySelector('.tag').textContent = t.col === 'done' ? 'Done' : t.tag;
        if (NEXT[t.col]) {
          const b = document.createElement('button'); b.textContent = NEXT[t.col][0];
          b.onclick = () => { t.col = NEXT[t.col][1]; fresh = t.id; draw(); sync(); };
          el.querySelector('.meta').appendChild(b);
        }
        list.appendChild(el);
      }
    }
  }
  // a pretend save, so the demo has some idle time for demoloom to speed up
  let timer = null;
  function sync() {
    const s = document.getElementById('status');
    s.classList.add('busy'); document.getElementById('status-text').textContent = 'Syncing...';
    clearTimeout(timer);
    timer = setTimeout(() => { s.classList.remove('busy'); document.getElementById('status-text').textContent = 'All synced'; }, 2400);
  }
  document.getElementById('add').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('new').value.trim();
    if (!v) return;
    tasks.push({ id: nextId, title: v, tag: 'New', col: 'todo' }); fresh = nextId++;
    document.getElementById('new').value = '';
    draw(); sync();
  });
  draw();
</script>
</body>
</html>
